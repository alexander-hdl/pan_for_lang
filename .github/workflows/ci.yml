# ARCHITECTURE.md §10.8. Шаги pfl validate / render / simulate / golden diff добавляются вместе с задачами,
# которые создают эти команды (V0.4, V0.7, M1).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    runs-on: windows-2025            # фиксированный образ вместо windows-latest (A19)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore -warnaserror

      - run: dotnet format --verify-no-changes --no-restore

      # Тесты идут через Microsoft.Testing.Platform (global.json -> test.runner); фильтр категорий — флагами xUnit v3.
      - name: Test
        run: >
          dotnet test -c Release --no-build
          --filter-not-trait "Category=UI"
          --filter-not-trait "Category=Interactive"
          --filter-not-trait "Category=Hardware"
          --filter-not-trait "Category=Nightly"

      - name: pfl smoke
        run: dotnet run -c Release --no-build --project tools/PenForLang.Tools.Cli -- --version
